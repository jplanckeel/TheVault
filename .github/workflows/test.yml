name: Test

on:
  push:
    branches: [ main, develop, feat/* ]
    paths:
      - 'backend/**'
      - 'web/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - 'web/**'
      - '.github/workflows/test.yml'

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest

    # Throwaway database for the store integration tests (TEST_DATABASE_URL).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: thevault_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build backend
        working-directory: backend
        run: go build -v ./...

      - name: Run tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/thevault_test?sslmode=disable
        run: go test -race -coverprofile=coverage.out ./... && go tool cover -func=coverage.out | tail -1

      - name: Vulnerability scan (govulncheck)
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Static security analysis (gosec)
        working-directory: backend
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.30.0 -quiet ./...

  test-web:
    name: Test Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        working-directory: web
        run: npm audit --audit-level=high

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Unit tests
        working-directory: web
        run: npm test

      - name: Build web app
        working-directory: web
        run: npm run build
