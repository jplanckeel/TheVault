name: Test

on:
  push:
    branches: [ main, develop, feat/* ]
    paths:
      - 'backend/**'
      - 'web/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - 'web/**'
      - '.github/workflows/test.yml'

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum
      
      - name: Build backend
        working-directory: backend
        run: go build -v ./...
      
      - name: Run tests
        working-directory: backend
        run: go test -v ./...

  test-web:
    name: Test Web
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      
      - name: Install dependencies
        working-directory: web
        run: npm ci
      
      - name: Build web app
        working-directory: web
        run: npm run build
        env:
          VITE_API_URL: /v1
