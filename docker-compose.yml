services:
  app:
    image: jplanckeel/thevaultbo:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/thevaultbo?sslmode=disable
      PORT: "8080"
      STATIC_DIR: /app/static
      UPLOAD_DIR: /app/uploads
      # Only reachable through Traefik: X-Forwarded-For can be trusted for rate limiting.
      TRUST_PROXY: "true"
      # Extra browser origins allowed by CORS (comma-separated); empty = same origin only.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      EBAY_CLIENT_ID: ${EBAY_CLIENT_ID}
      EBAY_CLIENT_SECRET: ${EBAY_CLIENT_SECRET}
      EBAY_CRON: ${EBAY_CRON:-0 3 * * 0}
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET}
      IGDB_CRON: ${IGDB_CRON:-0 4 * * 0}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      # Site address used in the links printed by `./server reset-password <email>`.
      PUBLIC_URL: ${PUBLIC_URL:-}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (openssl rand -hex 32)}
      API_KEY: ${API_KEY}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dokploy-network
      - internal
    labels:
      - traefik.enable=true
      - traefik.http.routers.thevaultbo.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.thevaultbo.entrypoints=websecure
      - traefik.http.routers.thevaultbo.tls.certresolver=letsencrypt
      - traefik.http.services.thevaultbo.loadbalancer.server.port=8080

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: thevaultbo
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
  uploads:

networks:
  dokploy-network:
    external: true
  internal:
    driver: bridge
