# ─── Gradle Build ─────────────────────────────────────────────────────────────
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# ─── Kotlin ───────────────────────────────────────────────────────────────────
kotlin.code.style=official
kotlin.incremental=true

# ─── Android ──────────────────────────────────────────────────────────────────
android.useAndroidX=true
android.nonTransitiveRClass=true
# Temporary AGP 9 opt-outs: detekt 1.x and ktlint-gradle do not support built-in Kotlin /
# the new DSL yet, SQLDelight needs Kotlin source sets. :androidApp opts in to built-in
# Kotlin with the com.android.built-in-kotlin plugin. Remove once the plugins are updated.
android.builtInKotlin=false
android.newDsl=false
android.disallowKotlinSourceSets=false

# ─── Compose ──────────────────────────────────────────────────────────────────
org.jetbrains.compose.experimental.uikit.enabled=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
